<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>系统设置 · 对料</title>
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/prototype.js" defer></script>
</head>
<body>
<div class="app-aurora"></div>
<div class="app-aurora-grid"></div>

<div class="screen">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM8 5.5c1.7 0 3.2.7 4.3 1.8l-1.4 1.4A3.9 3.9 0 0 0 8 7.5c-1.1 0-2.2.5-2.9 1.2L3.7 7.3A5.9 5.9 0 0 1 8 5.5zM8 1.5c2.9 0 5.5 1.2 7.4 3.1L14 6A8.6 8.6 0 0 0 8 3.5c-2.4 0-4.5.9-6 2.5L.6 4.6A10.6 10.6 0 0 1 8 1.5z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="app-header center">
    <span class="h-left">
      <a class="btn-icon" href="profile.html" aria-label="返回">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </span>
    <div class="h-title">系统设置</div>
    <span class="h-right"></span>
  </header>

  <div class="screen-body no-tabbar">
    <!-- AI 配置 -->
    <section class="section animate-fadeIn" style="margin-top:4px">
      <div class="section-title"><span class="st-dot"></span>AI 配置</div>
      <div class="glass-card card-pad">
        <!-- 服务方选择 -->
        <div class="grid2">
          <div class="glass-subtle card-pad" style="padding:12px;border-color:oklch(0.72 0.185 283 / 60%);box-shadow:0 0 0 3px oklch(0.72 0.185 283 / 15%)">
            <div class="fw-6 t-strong" style="font-size:13.5px">Kimi</div>
            <div class="fs-11 t-muted mt-8">月之暗面</div>
            <div class="fs-11 t-muted">全球通用</div>
          </div>
          <div class="glass-subtle card-pad" style="padding:12px">
            <div class="fw-6 t-strong" style="font-size:13.5px">OpenAI 官方</div>
            <div class="fs-11 t-muted mt-8">GPT 系列</div>
            <div class="fs-11 t-muted">全球通用</div>
          </div>
          <div class="glass-subtle card-pad" style="padding:12px">
            <div class="fw-6 t-strong" style="font-size:13.5px">阿里百炼兼容</div>
            <div class="fs-11 t-muted mt-8">通义系列</div>
            <div class="fs-11 t-muted">国内直连</div>
          </div>
          <div class="glass-subtle card-pad" style="padding:12px">
            <div class="fw-6 t-strong" style="font-size:13.5px">本地 Ollama</div>
            <div class="fs-11 t-muted mt-8">本地模型</div>
            <div class="fs-11 t-muted">私有化/无费用</div>
          </div>
        </div>

        <!-- 模型 / Key -->
        <div class="field" style="margin-top:16px">
          <label>模型</label>
          <div class="input">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg>
            <input type="text" value="kimi-k2-thinking">
          </div>
        </div>
        <div class="field">
          <label>API Key</label>
          <div class="input">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" placeholder="粘贴新的 API Key(演示不保存)" autocomplete="off">
          </div>
        </div>

        <!-- 状态行 -->
        <div class="flex aic gap-8" style="margin:4px 0 14px">
          <span class="pill warning"><span class="dot pulse"></span>样例状态 · 未实时检测</span>
          <span class="fs-11 t-muted grow">延迟 <span class="num">182</span>ms · 09-26 21:55 样例</span>
          <button type="button" class="btn-ghost"  style="padding:5px 10px;font-size:11.5px">重新检测</button>
        </div>

        <button type="button" class="btn-ghost"  style="width:100%">保存 AI 配置</button>
      </div>
    </section>

    <!-- 数据库 -->
    <section class="section animate-fadeIn d1">
      <div class="section-title"><span class="st-dot"></span>数据库</div>
      <div class="glass-card" style="padding:6px 16px 13px">
        <div class="list">
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            </div>
            <div class="li-main">
              <div class="li-title">主数据库</div>
              <div class="li-sub">App 应用库</div>
            </div>
            <span class="pill success"><span class="dot"></span>已连接</span>
          </div>
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            </div>
            <div class="li-main"><div class="li-title">用户账号 (users)</div></div>
            <span class="pill success">正常</span>
          </div>
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            </div>
            <div class="li-main"><div class="li-title">开奖期数 (draw)</div></div>
            <span class="pill success">正常</span>
          </div>
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            </div>
            <div class="li-main"><div class="li-title">数据源 (source)</div></div>
            <span class="pill success">正常</span>
          </div>
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon" style="background:var(--warning-soft);color:var(--warning)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            </div>
            <div class="li-main"><div class="li-title">问题记录 (issue)</div></div>
            <span class="pill warning">缺表</span>
          </div>
        </div>
        <div class="flex aic gap-8" style="padding:12px 0 0">
          <button type="button" class="btn-ghost"  style="padding:5px 10px;font-size:11.5px">补齐缺失表</button>
          <span class="fs-11 t-muted">检测到 <span class="num">1</span> 张缺失表</span>
        </div>
      </div>
    </section>

    <!-- 通用 -->
    <section class="section animate-fadeIn d2">
      <div class="section-title"><span class="st-dot"></span>通用</div>
      <div class="glass-card" style="padding:6px 16px">
        <div class="list">
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </div>
            <div class="li-main"><div class="li-title">深色模式</div></div>
            <span class="switch on"></span>
          </div>
          <div class="list-item" style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </div>
            <div class="li-main">
              <div class="li-title">自动静默刷新</div>
              <div class="li-sub">每 <span class="num">2</span> 分钟静默更新数据</div>
            </div>
            <span class="switch on"></span>
          </div>
          <button type="button" class="list-item"  style="padding-left:0;padding-right:0">
            <div class="li-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            </div>
            <div class="li-main"><div class="li-title">清理本地缓存</div></div>
            <span class="fs-12 t-muted">12.4 MB</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--foreground-muted)"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- 保存 -->
    <section class="section animate-fadeIn d3">
      <button type="button" class="glow-button">保存所有配置</button>
    </section>
  </div>
</div>
</body>
</html>
