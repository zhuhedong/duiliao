    groupsData:[{name:"特码",meta:"tema_n · 8 来源组 · 19 有效票",leader:"26",leaderVotes:8,totalVotes:19,leaderHit:true,tally:[["26",8,["海哥平特一肖","顶尖大师","管家婆传真"]],["14",6,["顶尖大师","白小组"]],["03",5,["海哥平特一肖","四海资料"]]]},{name:"特肖",meta:"texiao · 7 来源组 · 16 有效票",leader:"蛇",leaderVotes:7,totalVotes:16,leaderHit:true,tally:[["蛇",7,["海哥平特一肖","顶尖大师","管家婆传真"]],["龙",5,["海哥平特一肖","资料研究院"]],["鸡",4,["管家婆传真","白小组"]]]},{name:"平特肖",meta:"pingte_xiao · 5 来源组 · 8 有效票",leader:"蛇",leaderVotes:5,totalVotes:8,leaderHit:true,tally:[["蛇",5,["海哥平特一肖","管家婆传真"]],["龙",3,["顶尖大师","白小组"]]]}]
  }
};
let tab="frequency";
let playFilter="all";
const playCatalog=[
  ["tema_n","特码"],["texiao","特肖"],["tema_wei_n","特尾"],["tema_head_n","特头"],["tema_bose","特波"],["tema_twoface","两面"],["tema_halfwave","半波"],["hexiao","合肖"],
  ["pingte_xiao","平特肖"],["pingte_wei","平特尾"],["zhengma_n","正码"],["zhengxiao","正肖"],
  ["lianxiao_n","连肖"],["lianwei_n","连尾"],["lianma_2all","二中二"],["lianma_3all","三中三"],["lianma_3z2","三中二"],["lianma_2zt","二中特"],
  ["buzhong_num","不中码"],["buzhong_xiao","杀肖"],["buzhong_wei","杀尾"]
];
const $=s=>document.querySelector(s);
function current(){return data[$('#period').value]||data['2026277']}
const redNums=new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]); const blueNums=new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
function numberTone(n){const v=Number(n);return redNums.has(v)?'red':blueNums.has(v)?'blue':'green'}
function ballClass(n,bose){return `<span class="ball ${bose||numberTone(n)}">${n}</span>`}
function statusBadge(item){return item.hit?'<span class="hit">官方命中</span>':(current().draw?'<span class="miss">未命中</span>':'<span class="pending">待开奖</span>')}
function sources(list){return list.map(s=>`<span class="source-chip">${s}</span>`).join('')}
function boardTable(items,type){return `<div class="panel glass"><div class="panel-head"><div><div class="panel-title">${type==='tema'?'特码':'特肖'}出现频次排行</div><div class="panel-sub">票数按来源 + 分组去重，支持来源可展开查看</div></div><span class="small-badge">${items.length} 项</span></div><div style="overflow:auto"><table class="rank-table"><thead><tr><th>排名</th><th>候选项</th><th>得票</th><th>支持率</th><th>支持来源</th><th>核验</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td><span class="rank ${i===0?'first':i===1?'second':i===2?'third':''}">${i+1}</span></td><td><div class="candidate">${type==='tema'?ballClass(x.v,x.bose):`<span class="xiao">${x.v}</span>`}<div><div class="candidate-name">${type==='tema'?x.v+' 号':x.v+'肖'}</div><div class="candidate-sub">${type==='tema'?(x.bose==='blue'?'蓝波':x.bose==='red'?'红波':'绿波'):((['牛','马','羊','鸡','狗','猪'].includes(x.v))?'家禽':'野兽')}</div></div></div></td><td><span class="vote">${x.votes} 票</span></td><td><div class="rate-wrap"><div class="rate-line"><span class="rate">${x.pct.toFixed(1)}%</span><span class="bar"><i style="width:${Math.min(x.pct,100)}%"></i></span></div></div></td><td class="sources">${sources(x.sources)}</td><td>${statusBadge(x)}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderFrequency(){const d=current();const topN=d.tema[0],topX=d.texiao[0];return `<div class="kpi-grid"><div class="kpi glass accent"><div class="kpi-label">最热特码 <span>领跑第 1</span></div><div class="kpi-value">${topN.v} 号</div><div class="kpi-meta">${topN.votes} 票 · ${topN.pct.toFixed(1)}% · ${topN.bose==='blue'?'蓝波':topN.bose==='red'?'红波':'绿波'}</div></div><div class="kpi glass accent"><div class="kpi-label">最热特肖 <span>领跑第 1</span></div><div class="kpi-value">${topX.v}肖</div><div class="kpi-meta">${topX.votes} 票 · ${topX.pct.toFixed(1)}% · ${['牛','马','羊','鸡','狗','猪'].includes(topX.v)?'家禽':'野兽'}</div></div><div class="kpi glass"><div class="kpi-label">有效来源组</div><div class="kpi-value">${d.groups}</div><div class="kpi-meta">排除缺失状态 ${d.excluded} 组</div></div><div class="kpi glass ${d.draw?'good':'warn'}"><div class="kpi-label">领跑项核验</div><div class="kpi-value">${d.draw?((d.tema.filter(x=>x.hit).length)+(d.texiao.filter(x=>x.hit).length)):'待开奖'}</div><div class="kpi-meta">${d.draw?'已按官方开奖逐项核验':'开奖后自动核验'}</div></div></div><div class="section-grid">${boardTable(d.tema,'tema')}${boardTable(d.texiao,'texiao')}</div><div class="bottom-grid"><section class="method glass"><h3>这张榜单怎么计算</h3><div class="method-list"><div class="method-item"><span>计票单位</span><b>source_group</b></div><div class="method-item"><span>分母</span><b>eligible_source_groups = ${d.groups}</b></div><div class="method-item"><span>排除项</span><b>claimed_status = missing</b></div><div class="method-item"><span>算法版本</span><b>frequency-v1</b></div></div><div class="method-note">同一来源的不同栏目可以分别计票；同一来源组内部重复号码只计 1 票。这样排行榜展示的是“有多少有效来源组支持”，不是简单累加文本条数。</div></section><section class="review glass"><h3>开奖核验</h3>${d.draw?`<div class="draw-result"><span class="fs-label">官方号码</span>${d.draw.nums.map(n=>ballClass(n)).join('')}<span style="color:var(--muted)">+</span>${ballClass(d.draw.tema,'gold')}</div><div class="review-line">特码领跑 ${d.tema[0].hit?'命中':'未中'} · 特肖领跑 ${d.texiao[0].hit?'命中':'未中'} · 结果已冻结为 ${d.quality} 快照</div>`:`<div class="empty" style="padding:30px 10px 18px"><strong>尚未开奖</strong>当前榜单为实时预测汇总，开奖后会生成不可变快照并补写每一项 hit 状态。</div>`}</section></div>`}
function renderComparison(){const d=current();return `<div class="compare-grid"><div class="kpi glass"><div class="kpi-label">预测记录</div><div class="kpi-value">${d.compare.length}</div><div class="kpi-meta">当前样例重点记录数（非全量）</div></div><div class="kpi glass good"><div class="kpi-label">官方命中</div><div class="kpi-value">${d.draw?d.compare.filter(r=>r[4]==='hit').length:'待开奖'}</div><div class="kpi-meta">当前样例中官方命中记录</div></div><div class="kpi glass accent"><div class="kpi-label">综合命中率</div><div class="kpi-value">${d.draw?`${Math.round(d.compare.filter(r=>r[4]==='hit').length/Math.max(1,d.compare.filter(r=>r[4]!=='pending'&&r[4]!=='miss').length)*1000)/10}%`:'—'}</div><div class="kpi-meta">当前样例重点记录口径</div></div><div class="kpi glass warn"><div class="kpi-label">异常宣称</div><div class="kpi-value">2</div><div class="kpi-meta">官方核验未命中</div></div></div><section class="panel glass" style="margin-top:15px"><div class="panel-head"><div><div class="panel-title">数据入库与开奖比对</div><div class="panel-sub">按来源、玩法、原始预测与官方判定逐条核对</div></div><span class="small-badge">${d.compare.length} 条重点记录</span></div><div style="overflow:auto"><table class="rank-table compare-table"><thead><tr><th>来源</th><th>玩法</th><th>预测内容</th><th>官方结果</th><th>状态</th><th>证据</th></tr></thead><tbody>${d.compare.map(r=>`<tr><td class="source-cell">${r[0]}</td><td><span class="play-pill">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]==='hit'?'<span class="hit">官方命中</span>':r[4]==='miss'?'<span class="miss">缺期/未入榜</span>':'<span class="pending">待开奖</span>'}</td><td><button type="button" class="ghost-btn" style="padding:5px 8px;font-size:11px" onclick="alert('这里打开原始预测文本、来源栏目、采集时间与命中详情')">查看证据</button></td></tr>`).join('')}</tbody></table></div></section>`}
function predText(preds){return preds.map(p=>p.value||p.text||'').join(' · ')}
function renderConsensus(){const d=current();const all=[...d.groupsData];const visible=playFilter==='all'?all:all.filter(g=>g.name===playFilter||g.code===playFilter);return `<div class="kpi-grid"><div class="kpi glass accent"><div class="kpi-label">玩法组</div><div class="kpi-value">${visible.length}</div><div class="kpi-meta">当前筛选范围</div></div><div class="kpi glass"><div class="kpi-label">有效票数</div><div class="kpi-value">${visible.reduce((sum,g)=>sum+g.totalVotes,0)}</div><div class="kpi-meta">按玩法组有效票统计</div></div><div class="kpi glass good"><div class="kpi-label">领跑命中率</div><div class="kpi-value">${d.draw?`${d.groupsData.filter(g=>g.leaderHit===true).length}/${d.groupsData.length} · ${Math.round(d.groupsData.filter(g=>g.leaderHit===true).length/d.groupsData.length*100)}%`:'—'}</div><div class="kpi-meta">按有 leader_hit 的玩法组计算</div></div><div class="kpi glass warn"><div class="kpi-label">快照状态</div><div class="kpi-value" style="font-size:20px">${d.frozen?'已冻结':'实时'}</div><div class="kpi-meta">${d.frozen?'不可变结果':'等待开奖冻结'}</div></div></div><section class="panel glass" style="margin-top:15px"><div class="panel-head"><div><div class="panel-title">按玩法查看共识</div><div class="panel-sub">不同玩法独立归并，支持率分母为该玩法组有效票数</div></div><span class="small-badge">${visible.length} 组</span></div><div class="play-filters"><button type="button" class="play-filter ${playFilter==='all'?'active':''}" data-play="all">全部</button>${playCatalog.map(([code,name])=>`<button type="button" class="play-filter ${playFilter===code?'active':''}" data-play="${code}">${name}</button>`).join('')}</div></section>${visible.length?visible.map(g=>`<section class="group-card glass"><div class="group-header"><div><div class="group-name">${g.name}</div><div class="group-meta">${g.meta}</div></div>${g.leaderHit===true?'<span class="hit">领跑命中</span>':(d.draw?'<span class="miss">领跑未中</span>':'<span class="pending">待开奖</span>')}</div><div class="leader-box"><div class="leader-text">领跑：${g.leader}<small>${g.leaderVotes} 票 · 支持率 ${(g.leaderVotes/g.totalVotes*100).toFixed(1)}%</small></div><div class="bar" style="max-width:230px"><i style="width:${Math.round(g.leaderVotes/g.totalVotes*100)}%"></i></div></div>${g.tally.map((t,i)=>`<div class="tally-row"><div class="tally-pred">${i+1}. ${t[0]}</div><div class="tally-vote">${t[1]} 票</div><div class="tally-src">${t[2].join('、')}</div></div>`).join('')}</section>`).join(''):'<div class="empty glass" style="margin-top:15px"><strong>该玩法暂无共识数据</strong>可切换其他玩法或返回频次榜查看特码、特肖原子候选。</div>'}`}

function render(){const d=current();$('#contextBar').innerHTML=`<span class="context-item"><i class="dot ${d.frozen?'freeze':'live'}"></i><strong>${d.frozen?'冻结快照':'实时榜单'}</strong></span><span class="divider"></span><span class="context-item">彩种 <strong>${$('#lottery').selectedOptions[0].text}</strong></span><span class="context-item">期号 <strong>${$('#period').value}</strong></span><span class="context-item">口径 <strong>来源 + 分组去重</strong></span><span class="context-item">截止 <strong>${d.cutoff}</strong></span><span class="context-item">质量 <strong>${d.quality}</strong></span>`;$('#content').innerHTML=tab==='frequency'?renderFrequency():tab==='comparison'?renderComparison():renderConsensus();}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');tab=btn.dataset.tab;render()}));
document.addEventListener('click',e=>{const btn=e.target.closest('.play-filter');if(!btn)return;playFilter=btn.dataset.play;render();});
$('#queryBtn').addEventListener('click',()=>{const notice=$('#notice');notice.textContent='已按当前彩种、期号和榜单口径重新查询；展示的是设计样例数据。';notice.classList.add('show');render();setTimeout(()=>notice.classList.remove('show'),2600)});
$('#refreshBtn').addEventListener('click',()=>$('#queryBtn').click());
$('#freezeInfo').addEventListener('click',()=>{const n=$('#notice');n.textContent='冻结规则：官方开奖入库后，以开奖边界前的预测版本生成 frequency-v1 快照；普通查询不修改历史快照。';n.classList.add('show');setTimeout(()=>n.classList.remove('show'),4200)});
$('#prevBtn').addEventListener('click',()=>{$('#period').value='2026276';render()});$('#nextBtn').addEventListener('click',()=>{$('#period').value='2026277';render()});$('#lottery').addEventListener('change',()=>{const n=$('#notice');n.textContent='已切换彩种筛选。当前页面用澳门样例展示结构，其他彩种沿用同一计票与核验流程。';n.classList.add('show');render();setTimeout(()=>n.classList.remove('show'),3000)});
render();
</script>
