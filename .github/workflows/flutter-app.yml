name: Flutter mobile app

on:
  pull_request:
    paths:
      - 'duiliao_app/**'
      - '.github/workflows/flutter-app.yml'
  push:
    branches: [main]
    paths:
      - 'duiliao_app/**'
      - '.github/workflows/flutter-app.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duiliao_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-apk:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duiliao_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks || echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "ANDROID_KEYSTORE_BASE64 not set, falling back to debug signing for release build"
          fi
      - run: >-
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL="${{ vars.APP_API_BASE_URL }}"
          --dart-define=APP_SIGNING_SECRET="${{ secrets.APP_SIGNING_SECRET }}"
          --dart-define=APP_ID=android-internal
        # dart-defines are passed explicitly so a release can never silently use
        # the placeholder signing secret. The protected signing key is prepared
        # above and the Gradle release build refuses to use it unless present.
      - uses: actions/upload-artifact@v4
        with:
          name: duiliao-android-apk
          path: duiliao_app/build/app/outputs/flutter-apk/*.apk
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: duiliao_app/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

