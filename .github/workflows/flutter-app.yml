name: Flutter mobile app

on:
  pull_request:
    paths:
      - 'duiliao_app/**'
      - '.github/workflows/flutter-app.yml'
  push:
    branches: [main]
    paths:
      - 'duiliao_app/**'
      - '.github/workflows/flutter-app.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duiliao_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-apk:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duiliao_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Resolve and auto-bump app version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          BASE_SEMVER="${RAW_VER%+*}"
          BASE_BUILD="${RAW_VER#*+}"
          if [ "$BASE_BUILD" = "$RAW_VER" ]; then
            BASE_BUILD=1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            FINAL_VER="${GITHUB_REF#refs/tags/v}"
            FINAL_VER="${FINAL_VER%+*}"
          else
            MAJOR=$(echo "$BASE_SEMVER" | cut -d. -f1)
            MINOR=$(echo "$BASE_SEMVER" | cut -d. -f2)
            PATCH=$(echo "$BASE_SEMVER" | cut -d. -f3)

            # Find highest existing tag v${MAJOR}.${MINOR}.* to guarantee patch version always increments
            LATEST_TAG_PATCH=$(git tag -l "v${MAJOR}.${MINOR}.*" | sed -E "s/^v${MAJOR}\.${MINOR}\.([0-9]+).*$/\1/" | sort -n | tail -n 1)
            if [ -n "$LATEST_TAG_PATCH" ] && [ "$LATEST_TAG_PATCH" -ge "$PATCH" ]; then
              PATCH=$((LATEST_TAG_PATCH + 1))
            fi
            FINAL_VER="${MAJOR}.${MINOR}.${PATCH}"
          fi

          BUILD_NUM=$((BASE_BUILD + GITHUB_RUN_NUMBER))
          echo "version=${FINAL_VER}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FINAL_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v${FINAL_VER}+${BUILD_NUM}"

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks || echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "ANDROID_KEYSTORE_BASE64 not set, falling back to debug signing for release build"
          fi

      - name: Build Android APK with version
        run: >-
          flutter build apk --release --split-per-abi
          --build-name="${{ steps.version.outputs.version }}"
          --build-number="${{ steps.version.outputs.build_number }}"
          --dart-define=API_BASE_URL="${{ vars.APP_API_BASE_URL }}"
          --dart-define=APP_SIGNING_SECRET="${{ secrets.APP_SIGNING_SECRET }}"
          --dart-define=APP_ID=android-internal

      - name: Rename APKs and package versioned archive
        run: |
          VER="${{ steps.version.outputs.version }}"
          OUT_DIR="build/release-apk"
          mkdir -p "$OUT_DIR"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            base=$(basename "$apk")
            # app-arm64-v8a-release.apk -> duiliao-v2.1.2-arm64-v8a-release.apk
            abi_part="${base#app-}"
            cp "$apk" "${OUT_DIR}/duiliao-v${VER}-${abi_part}"
          done
          cd "$OUT_DIR"
          zip -9 "duiliao-android-v${VER}.zip" duiliao-v${VER}-*.apk
          # Release manifest (same shape as GitHub's releases/latest API) so the
          # app can read it via releases/latest/download/latest.json through a
          # download mirror when api.github.com is blocked or rate-limited.
          TAG="v${VER}" REPO="${GITHUB_REPOSITORY}" python3 - <<'PY'
          import glob, hashlib, json, os
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          assets = []
          for path in sorted(glob.glob(f"duiliao-{tag}-*.apk")):
              name = os.path.basename(path)
              data = open(path, "rb").read()
              assets.append({
                  "name": name,
                  "size": len(data),
                  "content_type": "application/vnd.android.package-archive",
                  "digest": "sha256:" + hashlib.sha256(data).hexdigest(),
                  "browser_download_url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              })
          json.dump({
              "tag_name": tag,
              "name": f"对料 App {tag}",
              "body": "",
              "html_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "prerelease": False,
              "draft": False,
              "assets": assets,
          }, open("latest.json", "w"), ensure_ascii=False, indent=2)
          PY
          ls -lh

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duiliao-android-v${{ steps.version.outputs.version }}
          path: duiliao_app/build/release-apk/duiliao-v${{ steps.version.outputs.version }}-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 对料 App ${{ steps.version.outputs.tag }}
          files: |
            duiliao_app/build/release-apk/duiliao-v${{ steps.version.outputs.version }}-*.apk
            duiliao_app/build/release-apk/duiliao-android-v${{ steps.version.outputs.version }}.zip
            duiliao_app/build/release-apk/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
